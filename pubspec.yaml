name: mart_pro_8
description: "МАРТ ПРО 8 - Расчет штор и текстиля"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2
  excel: ^2.1.0
  permission_handler: ^11.3.0
  share_plus: ^7.2.1
  file_picker: ^8.0.0
  flutter_riverpod: ^2.4.9  # 🔥 SENIOR: State management
  table_calendar: ^3.0.9
  riverpod_annotation: ^2.3.3
  go_router: ^12.0.0  # ✅ ДОБАВИТЬ
  image: ^4.1.0
  pdf: ^3.10.0
  cloud_firestore: ^4.14.0
  intl: ^0.19.0
